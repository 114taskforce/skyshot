; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-c6-devkitc-1]
; C6 / Arduino core 3.x 需要 pioarduino 分支的 espressif32 平台
; （官方 platformio/espressif32 6.x 不带 C6 的 Arduino 支持）
platform = espressif32
board = esp32-c6-devkitc-1
framework = arduino

; 默认分区表只给 app 1.31 MB，开了 WiFi + Web 服务就 92% 了；huge_app 给到 3 MB
board_build.partitions = huge_app.csv

board_build.f_cpu = 160000000L
monitor_speed = 115200
upload_speed = 460800

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

lib_deps =
    moononournation/GFX Library for Arduino@^1.6.7