; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-lcd28]
; 微雪 ESP32-S3-LCD-2.8（ST7789 320×240 横屏，SPI：SCLK=40 MOSI=45 CS=42 DC=41
; RST=39 BL=5，见 include/config.h）
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

board_build.partitions = huge_app.csv

monitor_speed = 115200
upload_speed = 460800
; S3 原生 USB-Serial-JTAG：用 esptool 走串口烧录即可。
; 不用 esp-builtin（OpenOCD）：它要经 libusb 抢 JTAG 接口，Windows 默认没给
; 这个接口装 WinUSB 驱动，会报 libusb_open() LIBUSB_ERROR_NOT_FOUND。
upload_protocol = esptool

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
    moononournation/GFX Library for Arduino@^1.6.7